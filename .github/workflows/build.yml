name: Build and Release APK

on:
  push:
    branches: [ "master", "main" ]
  pull_request:
    branches: [ "master", "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Grant execute permission
        run: chmod +x gradlew

      - name: Build release APK
        run: ./gradlew :app:assembleRelease --no-daemon

      - name: Sign release APK
        id: sign
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          ALIAS: ${{ secrets.ALIAS }}
        run: |
          set -e
          UNSIGNED_APK=$(find app/build/outputs/apk/release -maxdepth 2 -name '*.apk' | head -1)
          if [ -z "$UNSIGNED_APK" ]; then
            echo "No release APK found." >&2
            exit 1
          fi

          VERSION_NAME="3.0.$(git rev-list --count HEAD)"
          SHORT_SHA=${GITHUB_SHA::7}
          OUT_NAME="HyperPods-${VERSION_NAME}-${SHORT_SHA}.apk"

          BUILD_TOOLS=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)

          if [ -n "$SIGNING_KEY" ]; then
            echo "$SIGNING_KEY" | base64 -d > /tmp/keystore.jks
            "${BUILD_TOOLS}zipalign" -f 4 "$UNSIGNED_APK" "./$OUT_NAME"
            "${BUILD_TOOLS}apksigner" sign \
              --ks /tmp/keystore.jks \
              --ks-key-alias "$ALIAS" \
              --ks-pass "pass:$KEYSTORE_PASSWORD" \
              --key-pass "pass:$KEY_PASSWORD" \
              "./$OUT_NAME"
            rm /tmp/keystore.jks
            echo "signed=true" >> "$GITHUB_OUTPUT"
          else
            cp "$UNSIGNED_APK" "./$OUT_NAME"
            echo "signed=false" >> "$GITHUB_OUTPUT"
          fi
          echo "apk=$OUT_NAME" >> "$GITHUB_OUTPUT"
          echo "apk_path=./$OUT_NAME" >> "$GITHUB_OUTPUT"
          ls -lh "./$OUT_NAME"

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.sign.outputs.apk }}
          path: ${{ steps.sign.outputs.apk_path }}
          if-no-files-found: error

      - name: Compute release version
        id: ver
        run: |
          COUNT=$(git rev-list --count HEAD)
          echo "version=3.0.${COUNT}" >> "$GITHUB_OUTPUT"
          echo "tag=v3.0.${COUNT}" >> "$GITHUB_OUTPUT"

      - name: Send APK to Telegram
        if: ${{ steps.sign.outputs.signed == 'true' && github.event_name != 'pull_request' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          APK_PATH: ${{ steps.sign.outputs.apk_path }}
          APK_NAME: ${{ steps.sign.outputs.apk }}
        run: |
          set -e
          COMMIT_MSG=$(git log -1 --pretty=%s)
          CAPTION="HyperPods build: ${APK_NAME}%0ACommit: ${COMMIT_MSG}%0ABranch: ${GITHUB_REF_NAME}"
          curl -s -X POST \
            "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@${APK_PATH}" \
            -F "caption=${CAPTION}" \
            | tee /tmp/tg_response.json
          if ! grep -q '"ok":true' /tmp/tg_response.json; then
            echo "Telegram send failed" >&2
            exit 1
          fi
          echo "APK sent to Telegram successfully"

      # Auto-release on every push to main, no manual tagging needed. The tag is derived
      # from the commit count (v3.0.<revCount>) so each push produces a unique, sortable
      # release. ncipollo creates the tag if it does not exist.
      - name: Auto-create GitHub Release (push to main)
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.sign.outputs.signed == 'true' }}
        uses: ncipollo/release-action@v1
        with:
          token: ${{ github.token }}
          tag: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.version }}
          artifacts: ${{ steps.sign.outputs.apk_path }}
          generateReleaseNotes: true
          makeLatest: true